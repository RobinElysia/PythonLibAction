# pyproject.toml
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mysqlproject"
version = "0.1.0"
description = "Add your description here"
requires-python = "==3.10.11"
dependencies = [
    # 数据处理
    "lxml",
    "BeautifulSoup4",

    # 数据库
    "pymysql",
    "pymongo",
    "faiss-cpu",
    "SQLAlchemy",
    "mysqlclient", # SQLAlchemy链接mysql需要，和pymysql都可以

    # 机器学习基本工具
    "numpy>=1.23,<2",
    "pandas",
    "scikit-learn",
    "matplotlib",

    # 深度学习库
    "transformers",
    "datasets",
    "evaluate",
    "peft",
    "accelerate",
    "optimum",
    "sentencepiece",
    "nltk",
    "rouge",
    "torch==2.2.0+cu118",
    "torchvision==0.17.0+cu118",
    "torchaudio==2.2.0+cu118",
    "pillow>=9.0",
    "tqdm",
    "tensorboard",
    "scipy"
]

[[tool.pip.index-url]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu118"

[tool.setuptools]
packages = []      # 只装依赖，不打包任何源码